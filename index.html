<!doctype html><html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/><title>MathBridge — Nigerian Mathematics Curriculum</title></head><body><div id="root"></div><script type="module" src="/src/main_term.jsx"></script><script>(()=>{const install=()=>{const selects=[...document.querySelectorAll('select')];const level=[...selects].find(s=>[...s.options].some(o=>o.value==='Primary')&&[...s.options].some(o=>o.value==='JSS'));if(!level||level.dataset.sssBridge)return;if(![...level.options].some(o=>o.value==='SSS'))level.add(new Option('SSS','SSS'));level.dataset.sssBridge='1';level.addEventListener('change',e=>{if(e.target.value==='SSS'){e.preventDefault();e.stopImmediatePropagation();window.location.href='/sss.html'}},true)};new MutationObserver(install).observe(document.getElementById('root'),{childList:true,subtree:true});install();setInterval(install,250)})()</script></body></html>
