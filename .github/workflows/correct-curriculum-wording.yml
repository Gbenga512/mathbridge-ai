name: Curriculum wording QA
on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - '.github/workflows/correct-curriculum-wording.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  wording:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Verify build
        run: npm run build
