name: MathBridge Question Bank QA
on:
  push:
    branches: [main]
    paths:
      - 'src/data/questionBank.js'
      - 'src/data/questionFactory.js'
      - 'src/data/*.js'
      - 'scripts/verify-question-banks.mjs'
      - 'scripts/verify-question-quality.mjs'
      - 'package.json'
      - '.github/workflows/lock-question-banks.yml'
  pull_request:
    branches: [main]
    paths:
      - 'src/data/**'
      - 'scripts/verify-question-banks.mjs'
      - 'scripts/verify-question-quality.mjs'
      - 'package.json'
      - '.github/workflows/lock-question-banks.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install --no-audit --no-fund
      - run: npm run verify:question-banks
      - run: npm run verify:question-quality
      - run: npm run build
