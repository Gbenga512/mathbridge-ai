<!doctype html>
<html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/><title>MathBridge — Learn Maths Term by Term</title></head><body><div id="root"></div><script src="/src/curriculumWordingFix.js?v=3"></script><script type="module" src="/src/main_term.jsx"></script><script>(function(){const oldText='MathBridge follows the JSS1 scheme term by term, then week by week. Students always know what they are learning, what they have mastered and what comes next.';const newText='MathBridge follows the Nigerian Mathematics scheme for the selected class, term by term, then week by week. Students always know what they are learning, what they have mastered and what comes next.';const fix=()=>{const w=document.createTreeWalker(document.body,NodeFilter.SHOW_TEXT);let n;while(n=w.nextNode()){if(n.nodeValue&&n.nodeValue.includes(oldText)){n.nodeValue=n.nodeValue.replace(oldText,newText)}}};new MutationObserver(fix).observe(document.documentElement,{childList:true,subtree:true});setTimeout(fix,100);setTimeout(fix,1000);setTimeout(fix,3000)})();</script></body></html>
