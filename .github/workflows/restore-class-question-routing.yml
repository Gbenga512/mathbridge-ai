name: Restore class question routing
on:
  push:
    branches: [main]
    paths:
      - 'src/data/questionBank.js'
      - 'src/questionHistory.js'
      - '.github/workflows/restore-class-question-routing.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch-main:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Patch main question routing and no-repeat history
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/main.jsx');s=p.read_text()
          if "./questionHistory" not in s:
              anchor="import{getSession,getProgress as getCloudProgress,saveCloudProgress}from'./cloudProgress';"
              s=s.replace(anchor,anchor+"import{freshQuestions,markQuestionSeen,markQuestionsSeen}from'./questionHistory';",1)
          s=s.replace("const randomDiagnostic=(questions,count=10)=>", "const randomDiagnostic=(questions,count=10)=>")
          old="const selectedLevel=levelOptions.find(x=>x.value===level)||levelOptions[0];const levelTopics=curriculum.jss?.levels?.[level]?.topics||curriculum.primary?.levels?.[level]?.topics||curriculum.sss?.levels?.[level]?.topics||[];const questions=getQuestionsForLevel(level);const diagnosticQuestions=useMemo(()=>randomDiagnostic(questions,10),[questions,sessionSeed]);"
          new="const selectedLevel=levelOptions.find(x=>x.value===level)||levelOptions[0];const levelTopics=curriculum.jss?.levels?.[level]?.topics||curriculum.primary?.levels?.[level]?.topics||curriculum.sss?.levels?.[level]?.topics||[];const questions=getQuestionsForLevel(level);const freshBank=useMemo(()=>freshQuestions(userId||'local-user',questions),[userId,questions]);const diagnosticQuestions=useMemo(()=>randomDiagnostic(freshBank.length>=10?freshBank:questions,10),[freshBank,questions,sessionSeed,userId]);"
          if old in s:s=s.replace(old,new,1)
          old="const answer=n=>setAnswers({...answers,[diagnosticQuestions[i].id]:n});"
          new="const answer=n=>{const id=diagnosticQuestions[i]?.id;if(id)markQuestionSeen(userId||'local-user',id);setAnswers({...answers,[id]:n});};"
          if old in s:s=s.replace(old,new,1)
          old="const practiceSelect=n=>{if(!practiceDone)setPracticeAnswer(n)};"
          new="const practiceSelect=n=>{if(!practiceDone){if(practiceQuestion?.id)markQuestionSeen(userId||'local-user',practiceQuestion.id);setPracticeAnswer(n)}};"
          if old in s:s=s.replace(old,new,1)
          old="const submitChallengeAnswer=n=>{const next=[...challengeAnswers,n];"
          new="const submitChallengeAnswer=n=>{if(testQuestion?.id)markQuestionSeen(userId||'local-user',testQuestion.id);const next=[...challengeAnswers,n];"
          if old in s:s=s.replace(old,new,1)
          p.write_text(s)
          PY
      - name: Verify and commit
        run: |
          npm install --no-audit --no-fund
          npm run verify
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main.jsx
          git diff --cached --quiet || git commit -m "Enforce persistent no-repeat question history"
          git push
