name: Primary and JSS Curriculum QA
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: node scripts/primary1-qa.mjs
      - run: node scripts/primary2-qa.mjs
      - run: node scripts/primary3-qa.mjs
      - run: node scripts/primary4-qa.mjs
      - run: node scripts/primary5-qa.mjs
      - run: node scripts/primary6-qa.mjs
      - run: node scripts/jss1-qa.mjs
      - run: node scripts/jss1-integration-qa.mjs
      - run: node scripts/jss2-qa.mjs
      - run: node scripts/jss2-integration-qa.mjs
      - run: npm run build
